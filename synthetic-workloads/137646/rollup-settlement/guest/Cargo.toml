[package]
name = "guest"
version = "0.1.0"
edition = "2021"

[features]
guest = []

[dependencies]
jolt = { package = "jolt-sdk", git = "https://github.com/a16z/jolt" }
ledger = { path = "../ledger" }

# Load-bearing trigger conditions for issue #137646: the miscompilation only
# appears at opt-level >= 1 with incremental compilation disabled.
[profile.dev]
opt-level = 1
incremental = false
