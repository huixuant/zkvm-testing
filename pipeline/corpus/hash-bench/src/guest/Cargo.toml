[package]
name = "guest"
version = "0.1.0"
edition = "2021"

[features]
guest = []

# The binary (src/main.rs) is `#![no_main]` and only defines `main` under the
# `guest` feature (the macro emits it for the RISC-V build). Gate it so a host
# `cargo build` of the whole workspace skips it instead of failing to link;
# `jolt build` always passes `--features guest`, so the ELF is still produced.
[[bin]]
name = "guest"
path = "src/main.rs"
required-features = ["guest"]

[dependencies]
# Pinned to THIS local Jolt checkout (not git a16z/jolt) so the guest runtime,
# the host prover, and the installed `jolt` CLI are all the exact same version.
jolt = { package = "jolt-sdk", path = "/home/hxt25/msc-ip/jolt/jolt-sdk", default-features = false }

# The provable signature takes/returns `Vec<u8>`. In a no_std guest, postcard
# needs its `alloc` feature to (de)serialize `Vec` (this also turns on
# `serde/alloc`). Without it the guest fails to compile, not at runtime.
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Jolt inline hash primitives referenced directly by the lifted `hashbench`
# body. default-features = false keeps them in guest (no_std) mode — the `host`
# feature would pull the host-side sdk.
jolt-inlines-sha2 = { path = "/home/hxt25/msc-ip/jolt/jolt-inlines/sha2", default-features = false }
jolt-inlines-keccak256 = { path = "/home/hxt25/msc-ip/jolt/jolt-inlines/keccak256", default-features = false }
jolt-inlines-blake2 = { path = "/home/hxt25/msc-ip/jolt/jolt-inlines/blake2", default-features = false }
jolt-inlines-blake3 = { path = "/home/hxt25/msc-ip/jolt/jolt-inlines/blake3", default-features = false }

# RustCrypto / blake3 reference implementations the body cross-checks against.
# default-features = false keeps their transitive graph (crypto-common, digest)
# no_std, avoiding the `extern crate std` failure on the guest target.
sha2 = { version = "0.11.0", default-features = false }
sha3 = { version = "0.10", default-features = false }
blake2 = { version = "0.11.0-rc", default-features = false }
blake3 = { version = "1.6", default-features = false }
