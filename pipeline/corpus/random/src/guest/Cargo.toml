[package]
name = "guest"
version = "0.1.0"
edition = "2021"

[features]
guest = []

# The binary (src/main.rs) is `#![no_main]` and only defines `main` under the
# `guest` feature (the macro emits it for the RISC-V build). Gate it so a host
# `cargo build` of the whole workspace skips it instead of failing to link;
# `jolt build` always passes `--features guest`, so the ELF is still produced.
[[bin]]
name = "guest"
path = "src/main.rs"
required-features = ["guest"]

[dependencies]
# Pinned to THIS local Jolt checkout (not git a16z/jolt) so the guest runtime,
# the host prover, and the installed `jolt` CLI are all the exact same version.
# Default features are LEFT ON here (unlike other ports) because the default
# feature is `jolt-platform/random`, which registers Jolt's deterministic custom
# getrandom backend (fixed SEED) for getrandom v0.2 AND v0.3. Both `rand` crates
# below reach getrandom via `from_entropy` / `from_os_rng`; without this feature
# getrandom has no backend on riscv64imac-unknown-none-elf and fails to compile.
# (`jolt build` also passes `--cfg getrandom_backend="custom"` for the v0.3 side.)
jolt = { package = "jolt-sdk", path = "/home/hxt25/msc-ip/jolt/jolt-sdk" }

# The provable signature takes/returns `Vec<u8>`. In a no_std guest, postcard
# needs its `alloc` feature to (de)serialize `Vec` (this also turns on
# `serde/alloc`). Without it the guest fails to compile, not at runtime.
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Two `rand` versions used by the benchmark under test. Both are kept no_std:
# `default-features = false` drops `std`, and the enabled features route their
# seeding through getrandom (custom backend above) rather than any OS syscall.
rand_v08 = { version = "0.8.5", package = "rand", default-features = false, features = [
  "std_rng",
  "getrandom",
] }
rand_v09 = { version = "0.9.2", package = "rand", default-features = false, features = [
  "std_rng",
  "os_rng",
] }
