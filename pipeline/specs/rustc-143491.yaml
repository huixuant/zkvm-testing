id: rustc-143491

upstream:
  rust_issue: https://github.com/rust-lang/rust/issues/143491

buggy_toolchain: b5e10d8c00-rustc   # ZEROOS_GUEST_TOOLCHAIN value for the buggy guest
fixed_toolchain: default            # ZEROOS_GUEST_TOOLCHAIN unset => stock guest toolchain

opt_toggle: mir_opt_level
bug_layer: mir
riscv_triggering: verified     # confirmed to trigger on riscv64imac

instrumentation:
  layer: mir                              # rustc MIR pass (operates on Body/Local/borrows)
  pass: borrow-class-miscompile-143491    # the instrumented pass (rename to your internal label)
  signal: file                            # appends to the file named by $env
  env: MISCOMP_LOG                         # set this to a per-crate log path before compiling
  match: '^MISCOMP rustc-143491 triggered' # a fired detection

mir_opt_toggle:
  build_rs: /home/hxt25/msc-ip/zeroos-local/crates/zeroos-build/src/cmds/build.rs
  flag_line_marker: 'PIPELINE_TOGGLE_rustc-143491'   # COMMENTED => buggy (pass runs); UNCOMMENTED => normal
  jolt_dir: /home/hxt25/msc-ip/jolt
  rebuild_cmd: 'cargo install --path .'
  buggy_state: commented

